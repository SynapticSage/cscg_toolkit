# MNIST Experiment Configuration
# Created: 2025-11-09

# Training
batch_size: 128
epochs: 10
learning_rate: 0.001
weight_decay: 0.0001

# Model
model:
  dropout: 0.5

# CHMM (for hybrid model)
chmm:
  n_states: 81  # 9 observations × 9 clones
  n_actions: 4

# Data
data:
  num_workers: 4
  data_dir: './data'

# Logging
logging:
  log_interval: 100  # Log every N batches
  save_dir: '../../results/checkpoints/mnist'
  tensorboard_dir: '../../results/logs/mnist'

# Reproducibility
seed: 42

# Device
device: 'cuda'  # or 'cpu'
